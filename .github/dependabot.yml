version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait before proposing a new release so a compromised one is likely
    # yanked first. Security updates are not delayed by this.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait before proposing a new release so a compromised one is likely
    # yanked first. Security updates are not delayed by this.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait before proposing a new release so a compromised one is likely
    # yanked first. Security updates are not delayed by this.
    cooldown:
      default-days: 7
    ignore:
      # The bundled aiocoap monkeypatches are only validated for 0.4.x.
      # A pin bump also needs `python3 scripts/vendor.py` (CI fails until run).
      - dependency-name: aiocoap
        versions: [">=0.5"]
