name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm install
      # npm test runs the runner's python3, so give it the plugin's Python
      # dependencies; otherwise dependency-gated tests are silently skipped.
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt flake8
      - name: Lint
        run: npm run lint
      # Errors only (syntax, undefined names); style warnings are not gated.
      - name: Python lint
        run: python -m flake8 --select=E9,F63,F7,F82 philips_air_api.py aioairctrl scripts tests
      - name: Test
        run: npm test
