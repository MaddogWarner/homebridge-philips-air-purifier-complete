name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Homebridge Verified requires every supported Node LTS.
        node: ['22', '24', '26']
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: npm ci
      # Runtime Python packages are deliberately NOT pip-installed: the tests
      # must pass with only the bundled vendor/ copies, as users get them.
      - name: Lint
        run: npm run lint
      # Errors only (syntax, undefined names); style warnings are not gated.
      # flake8 runs in its own venv so it can't leak packages into the tests.
      - name: Python lint
        run: |
          python -m venv /tmp/lint
          /tmp/lint/bin/pip install --quiet flake8
          /tmp/lint/bin/flake8 --select=E9,F63,F7,F82 philips_air_api.py aioairctrl scripts tests
      - name: Test
        run: npm test

  vendor:
    name: vendor/ is exactly the pinned wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      # Installs the pinned wheels with --require-hashes into a temp dir and
      # fails on any added, missing or modified file in vendor/.
      - run: python scripts/vendor.py --check

  package:
    name: package installs with no scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each runner's own system Python, as a user would have it.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Pack and install into a clean prefix
        run: |
          node -e "const s = require('./package.json').scripts || {}; for (const k of ['preinstall','install','postinstall','prepare']) if (s[k]) { console.error('lifecycle script present: ' + k); process.exit(1); }"
          npm pack --silent
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean" && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/homebridge-philips-air-purifier-complete-*.tgz
      - name: Bundled daemon loads and starts on the system Python
        run: |
          P="$RUNNER_TEMP/clean/node_modules/homebridge-philips-air-purifier-complete"
          # Start the real daemon from the installed package, through the
          # plugin's own spawn code, for each local protocol.
          node scripts/ci/daemon-smoke.js "$P"
          test -z "$(find "$P" -name __pycache__)" || { echo "bytecode written into the plugin dir"; exit 1; }

  # Branch protection requires a check named "build"; it passes only if every
  # matrix leg and the packaging checks pass.
  build:
    name: build
    if: always()
    needs: [test, vendor, package]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: |
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.vendor.result }}" = success ] && [ "${{ needs.package.result }}" = success ]
