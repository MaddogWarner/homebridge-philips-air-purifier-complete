name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Tests run in their own job without the OIDC publish permission, so no
  # third-party code runs where the publish token is available.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: python scripts/vendor.py --check  # pip --require-hashes; fails on any difference
      - run: npm run lint
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings
    # so every publish needs a manual approval.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # Required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm install -g npm@11.21.3  # Trusted publishing requires npm >= 11.5.1
      # No install step: the package has no runtime build, and skipping it keeps
      # third-party install scripts out of the job that holds the OIDC token.
      - run: npm publish --provenance
        # No NODE_AUTH_TOKEN — OIDC is used instead; any token value (even empty) blocks OIDC
